<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — Sông nước Miền Tây</title>
<style>
  html, body { margin: 0; height: 100%; background: #120d08; color: #f6ead2; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  body.hc canvas { filter: contrast(1.6) saturate(1.3); }   /* chế độ tương phản cao (v1.3) */
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp. CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua. Mọi hình vẽ bằng canvas (tự vẽ, không asset ngoài) theo phong cách
 * "Sông nước Miền Tây": lặn sông phù sa buổi sáng, quán sàn gỗ buổi tối, ghe tạp hóa cuối ngày.
 * Hiệu ứng động (ánh nắng, bọt khí, lửa, đèn lồng) dùng đồng hồ trình duyệt, KHÔNG ảnh hưởng mô phỏng ở server.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 * Mode day (TV4): P = tạm dừng · 1 = mua oxy · 2 = mua Máu · E ở Shop = rời Shop.
 * v1.3: H = bật/tắt tương phản cao (hoặc ?contrast=high). 3 cảnh báo chữ + biểu tượng: cá sấu gần, oxy sắp hết, khách sắp giận.
 */
const cv = document.getElementById("c");
let ctx = cv.getContext("2d");   // let: vẽ nền tĩnh vào canvas phụ rồi đổi lại
let snap = null, offline = false;

// ---------- vào: phím ----------
const down = new Set();
const DAY_KEYS = { p: "pause", "1": "buy_oxygen", "2": "buy_hp" };
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

// mode day: màn vẽ theo pha đang chơi (gather / quan / shop / done)
function viewMode() { return !snap ? "gather" : (snap.mode === "day" ? snap.day_phase : snap.mode); }
function currentInput() {
  const mode = viewMode();
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  const inp = { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
  if (snap && snap.mode === "day") { inp.pause = down.has("pause"); inp.buy_oxygen = down.has("buy_oxygen"); inp.buy_hp = down.has("buy_hp"); }
  return inp;
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  else if (DAY_KEYS[k]) down.add(DAY_KEYS[k]);
  else if (k === "h") setHighContrast(!HC);
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  else if (DAY_KEYS[k]) down.delete(DAY_KEYS[k]);
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ: tên, màu, tiện ích ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const DISH_NAME = {
  ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh bông điên điển",
  canh_chua_ca_loc: "Canh chua cá lóc", ca_keo_nuong: "Cá kèo nướng", lau_mam: "Lẩu mắm",
};
const dishName = (id) => DISH_NAME[id] || id || "?";
const FISH_KINDS = new Set(["ca_loc", "ca_linh", "ca_keo"]);
const kindOf = (x) => (x && typeof x === "object" ? x.kind : x);   // v1.2: cá thể {id, kind, fresh}; v1.1: chuỗi
const kc = (k) => KIND_COLOR[kindOf(k)] || "#bbbbbb";
const FONT = "\"Segoe UI\", \"Noto Sans\", system-ui, sans-serif";
let T = 0, DT = 0;   // giây (đồng hồ trình duyệt) — chỉ cho hiệu ứng
const hashStr = (s) => { let h = 7; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h); };

// tóm tắt kho/giỏ: "cá lóc×2 (tươi 80–99)"; nhận cả mảng cá thể v1.2 lẫn object đếm v1.1
function summarizeItems(items) {
  if (!items) return "";
  if (!Array.isArray(items)) return Object.keys(items).map((k) => (KIND_NAME[k] || k) + "×" + items[k]).join(", ");
  const g = {};
  items.forEach((it) => { const k = kindOf(it), f = typeof it === "object" ? it.fresh : null;
    const e = g[k] || (g[k] = { n: 0, lo: Infinity, hi: -Infinity }); e.n++;
    if (f != null) { e.lo = Math.min(e.lo, f); e.hi = Math.max(e.hi, f); } });
  return Object.keys(g).map((k) => { const e = g[k];
    const fr = e.lo === Infinity ? "" : ` (tươi ${Math.floor(e.lo)}${e.hi !== e.lo ? "–" + Math.floor(e.hi) : ""})`;
    return (KIND_NAME[k] || k) + "×" + e.n + fr; }).join(", ");
}
// gom kho theo loại: [{kind, n, spoiled}] (cho hàng biểu tượng)
function groupItems(items) {
  const g = {}, order = [];
  (Array.isArray(items) ? items : Object.keys(items || {}).flatMap((k) => Array(items[k]).fill(k))).forEach((raw) => {
    const info = getItemInfo(raw); if (!info) return;
    if (!g[info.kind]) { g[info.kind] = { kind: info.kind, n: 0, spoiled: 0, lo: Infinity }; order.push(info.kind); }
    const e = g[info.kind]; e.n++; if (info.spoiled) e.spoiled++; if (info.fresh != null) e.lo = Math.min(e.lo, info.fresh);
  });
  return order.map((k) => g[k]);
}

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.weight || (HC ? "bold" : "")) + " " + (o.size || 14) + "px " + (o.font || FONT);
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  if (o.stroke) { ctx.lineJoin = "round"; ctx.lineWidth = o.strokeW || 3; ctx.strokeStyle = HC ? "#000" : o.stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = o.color || (HC ? "#ffffff" : "#f6ead2");
  ctx.fillText(s, x, y);
}
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); }
// bảng gỗ cho HUD (vân gỗ, viền vàng đồng)
function panel(x, y, w, h, o = {}) {
  const r = o.r ?? 10;
  ctx.save();
  if (HC) { rr(x, y, w, h, r); ctx.fillStyle = "#000"; ctx.fill(); ctx.strokeStyle = "#ffeb3b"; ctx.lineWidth = 2; ctx.stroke(); ctx.restore(); return; }
  ctx.shadowColor = "rgba(0,0,0,.4)"; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, o.top || "#7b5331"); g.addColorStop(1, o.bottom || "#4a2e17");
  rr(x, y, w, h, r); ctx.fillStyle = g; ctx.globalAlpha = o.alpha ?? 0.94; ctx.fill(); ctx.globalAlpha = 1;
  ctx.shadowColor = "transparent";
  ctx.save(); rr(x, y, w, h, r); ctx.clip();
  ctx.strokeStyle = o.grain || "rgba(255,222,170,.07)"; ctx.lineWidth = 1;
  for (let yy = y + 5; yy < y + h; yy += 6) { ctx.beginPath(); ctx.moveTo(x, yy); ctx.bezierCurveTo(x + w * 0.3, yy + 2, x + w * 0.7, yy - 2, x + w, yy + 1); ctx.stroke(); }
  ctx.restore();
  rr(x + 0.5, y + 0.5, w - 1, h - 1, r); ctx.strokeStyle = o.border || "#e2ba7a"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}
function bar(x, y, w, h, frac, color, label) {
  frac = Math.max(0, Math.min(1, frac));
  rr(x, y, w, h, h / 2); ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fill();
  if (frac > 0) {
    ctx.save(); rr(x, y, w, h, h / 2); ctx.clip();
    ctx.fillStyle = color; ctx.fillRect(x, y, w * frac, h);
    ctx.fillStyle = "rgba(255,255,255,.25)"; ctx.fillRect(x, y + 1, w * frac, h * 0.35);
    ctx.restore();
  }
  rr(x + 0.5, y + 0.5, w - 1, h - 1, h / 2); ctx.strokeStyle = HC ? "#ffeb3b" : "rgba(255,240,210,.6)"; ctx.lineWidth = 1; ctx.stroke();
  if (label) text(label, x + w / 2, y + h / 2 + 1, { size: Math.max(10, h - 5), align: "center", base: "middle", weight: "bold", stroke: "rgba(0,0,0,.55)" });
}
function chip(s, x, y, o = {}) {   // nhãn nhỏ nền tối, căn giữa tại (x, y)
  ctx.font = (o.weight || "bold") + " " + (o.size || 11) + "px " + FONT;
  const tw = ctx.measureText(s).width + 10, th = (o.size || 11) + 7;
  rr(x - tw / 2, y - th / 2, tw, th, th / 2); ctx.fillStyle = HC ? "#000" : (o.bg || "rgba(30,18,8,.72)"); ctx.fill();
  if (o.border || HC) { ctx.strokeStyle = HC ? "#ffeb3b" : o.border; ctx.lineWidth = 1; ctx.stroke(); }
  text(s, x, y + 1, { size: o.size || 11, align: "center", base: "middle", weight: o.weight || "bold", color: o.color || "#fff3dc" });
}
function heartPath(x, y, r) {
  ctx.beginPath(); ctx.moveTo(x, y + r * 0.9);
  ctx.bezierCurveTo(x - r * 1.4, y - r * 0.1, x - r * 0.7, y - r * 1.2, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.7, y - r * 1.2, x + r * 1.4, y - r * 0.1, x, y + r * 0.9); ctx.closePath();
}
function starPath(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 5, rr2 = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
  ctx.closePath();
}
function stars(x, y, val, max, r) {   // uy tín: sao vàng lấp theo phần thập phân
  for (let i = 0; i < max; i++) {
    const cx = x + i * r * 2.3, f = Math.max(0, Math.min(1, val - i));
    starPath(cx, y, r); ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fill();
    if (f > 0) { ctx.save(); starPath(cx, y, r); ctx.clip(); ctx.fillStyle = "#ffd257"; ctx.fillRect(cx - r, y - r, 2 * r * f, 2 * r); ctx.restore(); }
    starPath(cx, y, r); ctx.strokeStyle = "#ffe9a8"; ctx.lineWidth = 1; ctx.stroke();
  }
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 56 ? s.slice(0, 53) + "…" : s; } catch (e) { return ""; }
}
function eventLog(w, h) {   // nhật ký sự kiện (mờ, góc phải dưới)
  const ev = (snap.events || []).slice(-4);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 12, h - 34 - (ev.length - 1 - i) * 14,
    { size: 10, align: "right", color: "rgba(255,240,215,.62)", stroke: "rgba(0,0,0,.45)", strokeW: 2 }));
}
function overlay(w, h) {
  if (offline) chip("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 92, { size: 15, bg: "rgba(120,20,10,.9)" });
  if (snap.error) chip("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 118, { size: 14, bg: "rgba(120,20,10,.9)" });
  if (snap.finished && !(snap.mode === "day" && viewMode() === "done")) {
    ctx.fillStyle = "rgba(10,6,2,.55)"; ctx.fillRect(0, 0, w, h);
    panel(w / 2 - 230, h / 2 - 70, 460, 140, { r: 16 });
    const title = snap.mode === "gather" ? "Buổi sáng kết thúc" : "Quán đóng cửa";
    text(title, w / 2, h / 2 - 28, { align: "center", size: 24, weight: "bold", color: "#ffe2a0" });
    text("Lý do: " + (snap.reason || "—") + `  ·  tiền ${snap.money ?? 0}k  ·  điểm ${snap.score ?? 0}`, w / 2, h / 2 + 6, { align: "center", size: 15 });
    text("Nhấn R để chơi lại", w / 2, h / 2 + 40, { align: "center", size: 14, color: "#e9d4ad" });
  }
}

// Trích xuất thông tin nguyên liệu & độ tươi (hỗ trợ v1.0/v1.1 chuỗi và v1.2 đối tượng {id, kind, fresh, spoiled})
function getItemInfo(item) {
  if (!item) return null;
  if (typeof item === "string") return { kind: item, fresh: null, maxFresh: null, spoiled: false };
  const kind = item.kind || "ca_loc";
  const fresh = item.fresh !== undefined ? item.fresh : (item.freshness !== undefined ? item.freshness : null);
  const maxFresh = item.max_fresh || item.max_freshness || (fresh !== null ? Math.max(60, fresh) : null);
  const spoiled = Boolean(item.spoiled || (fresh !== null && fresh <= 0));
  return { id: item.id || null, kind, fresh, maxFresh, spoiled };
}

// ---------- hình nguyên liệu: cá đồng & bông/rau sông nước ----------
// vẽ cá tại gốc tọa độ, đầu hướng +x, L = chiều dài (px)
function drawFishShape(kind, L, spoiled) {
  const H = L * (kind === "ca_linh" ? 0.42 : kind === "ca_loc" ? 0.3 : 0.25);
  const body = spoiled ? "#6b7a80" : ({ ca_loc: "#4d5a2c", ca_linh: "#c9d8e2", ca_keo: "#9c7044" })[kind] || "#999";
  const belly = spoiled ? "#8f9ca1" : ({ ca_loc: "#c4bd8c", ca_linh: "#f7fbfd", ca_keo: "#dcc093" })[kind] || "#ccc";
  const fin = spoiled ? "#5b686d" : ({ ca_loc: "#3a4520", ca_linh: "#e7a9a0", ca_keo: "#7d5530" })[kind] || "#888";
  ctx.fillStyle = fin;
  ctx.beginPath();   // đuôi: cá linh đuôi chẻ, cá lóc / cá kèo đuôi tròn
  if (kind === "ca_linh") { ctx.moveTo(-L * 0.36, 0); ctx.lineTo(-L * 0.56, -H * 0.6); ctx.lineTo(-L * 0.47, 0); ctx.lineTo(-L * 0.56, H * 0.6); }
  else { ctx.moveTo(-L * 0.38, 0); ctx.quadraticCurveTo(-L * 0.6, -H * 0.7, -L * 0.56, 0); ctx.quadraticCurveTo(-L * 0.6, H * 0.7, -L * 0.38, 0); }
  ctx.closePath(); ctx.fill();
  ctx.beginPath();   // vây lưng
  if (kind === "ca_loc") { ctx.moveTo(-L * 0.36, -H * 0.3); ctx.quadraticCurveTo(-L * 0.05, -H * 0.9, L * 0.2, -H * 0.38); ctx.lineTo(-L * 0.36, -H * 0.2);
    ctx.moveTo(-L * 0.32, H * 0.3); ctx.quadraticCurveTo(-L * 0.1, H * 0.75, L * 0.08, H * 0.32); }
  else if (kind === "ca_keo") { ctx.moveTo(-L * 0.05, -H * 0.4); ctx.lineTo(L * 0.05, -H * 0.95); ctx.lineTo(L * 0.14, -H * 0.4);
    ctx.moveTo(-L * 0.32, -H * 0.35); ctx.quadraticCurveTo(-L * 0.2, -H * 0.85, -L * 0.08, -H * 0.38); }
  else { ctx.moveTo(-L * 0.08, -H * 0.42); ctx.lineTo(L * 0.02, -H * 0.85); ctx.lineTo(L * 0.1, -H * 0.42); }
  ctx.fill();
  const g = ctx.createLinearGradient(0, -H / 2, 0, H / 2);
  g.addColorStop(0, body); g.addColorStop(0.6, body); g.addColorStop(1, belly);
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, L * 0.44, H / 2, 0, 0, Math.PI * 2); ctx.fill();
  if (!spoiled) {
    if (kind === "ca_loc") { ctx.fillStyle = "rgba(25,30,12,.55)";   // vằn đốm cá lóc
      for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(-L * 0.24 + i * L * 0.13, -H * 0.04, L * 0.035, H * 0.24, 0.35, 0, Math.PI * 2); ctx.fill(); } }
    else if (kind === "ca_linh") { ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.fillRect(-L * 0.3, -H * 0.07, L * 0.55, H * 0.09); }
    else { ctx.fillStyle = "rgba(60,35,15,.55)"; for (let i = 0; i < 5; i++) { circle(-L * 0.25 + i * L * 0.1, -H * 0.08 + (i % 2) * H * 0.15, Math.max(0.6, H * 0.06)); ctx.fill(); } }
  }
  const ex = L * 0.3, ey = kind === "ca_keo" ? -H * 0.28 : -H * 0.08, er = Math.max(1.1, H * (kind === "ca_keo" ? 0.19 : 0.13));
  ctx.fillStyle = "#fffbe8"; circle(ex, ey, er); ctx.fill();
  ctx.fillStyle = "#111"; circle(ex + er * 0.2, ey, er * 0.55); ctx.fill();
}
// bông súng / bông điên điển / kèo nèo tại gốc (k = px trên mét)
function drawPlantShape(kind, k) {
  if (kind === "bong_sung") {        // hoa súng tím hồng nở trên lá tròn
    for (let i = 0; i < 8; i++) {
      ctx.save(); ctx.rotate((i * Math.PI) / 4 + 0.2);
      const g = ctx.createLinearGradient(0, 0, 0, -0.55 * k); g.addColorStop(0, "#f7c7da"); g.addColorStop(1, "#d9578c");
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, -0.28 * k, 0.12 * k, 0.3 * k, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    ctx.fillStyle = "#ffd54a"; circle(0, 0, 0.13 * k); ctx.fill();
  } else if (kind === "bong_dien_dien") {   // chùm bông điên điển vàng rủ
    ctx.strokeStyle = "#6f8a3a"; ctx.lineWidth = Math.max(1, 0.06 * k);
    ctx.beginPath(); ctx.moveTo(-0.4 * k, -0.2 * k); ctx.quadraticCurveTo(0, -0.55 * k, 0.45 * k, -0.25 * k); ctx.stroke();
    for (let i = 0; i < 6; i++) {
      const x = -0.35 * k + i * 0.15 * k, y = -0.28 * k + Math.abs(i - 2.5) * 0.04 * k;
      ctx.fillStyle = i % 2 ? "#f6c52b" : "#ffdb4d";
      ctx.beginPath(); ctx.ellipse(x, y + 0.14 * k, 0.08 * k, 0.15 * k, 0.3 * (i - 2.5) / 2.5, 0, Math.PI * 2); ctx.fill();
    }
  } else {                                 // kèo nèo: lá xanh hình bầu dục trên cuống, hoa vàng nhạt
    ctx.strokeStyle = "#4f7d2c"; ctx.lineWidth = Math.max(1, 0.05 * k);
    [[-0.3, -0.55, -0.5], [0, -0.7, 0], [0.3, -0.5, 0.5]].forEach(([dx, dy, a]) => {
      ctx.beginPath(); ctx.moveTo(0, 0.2 * k); ctx.lineTo(dx * k, dy * k + 0.15 * k); ctx.stroke();
      ctx.fillStyle = "#8fcf6b"; ctx.beginPath(); ctx.ellipse(dx * k, dy * k, 0.17 * k, 0.24 * k, a, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(40,80,20,.6)"; ctx.beginPath(); ctx.moveTo(dx * k, dy * k + 0.2 * k); ctx.lineTo(dx * k, dy * k - 0.2 * k); ctx.stroke();
      ctx.strokeStyle = "#4f7d2c";
    });
    ctx.fillStyle = "#fff2a6"; for (let i = 0; i < 3; i++) { circle(0.12 * k * Math.cos(i * 2.1), -0.15 * k + 0.12 * k * Math.sin(i * 2.1), 0.08 * k); ctx.fill(); }
  }
}
function drawItemIcon(kind, x, y, sz, spoiled) {

// ---------- món đặc sản Miền Tây (biểu tượng tự vẽ) ----------
function drawDish(id, x, y, sz, steam = true) {
  ctx.save(); ctx.translate(x, y);
  const r = sz / 2;
  const plate = () => {   // đĩa sứ viền xanh
    ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(0, r * 0.12, r, r * 0.62, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#f8f4ea"; ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#3d6fb0"; ctx.lineWidth = Math.max(1, r * 0.08); ctx.beginPath(); ctx.ellipse(0, 0, r * 0.88, r * 0.52, 0, 0, Math.PI * 2); ctx.stroke();
  };
  const pot = (broth) => {   // nồi lẩu đất
    ctx.fillStyle = "#3a2516"; ctx.beginPath(); ctx.ellipse(0, r * 0.15, r * 0.95, r * 0.62, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#2a1a0e"; ctx.fillRect(-r * 1.12, -r * 0.05, r * 0.28, r * 0.14); ctx.fillRect(r * 0.84, -r * 0.05, r * 0.28, r * 0.14);
    ctx.fillStyle = "#6e4425"; ctx.beginPath(); ctx.ellipse(0, 0, r * 0.88, r * 0.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = broth; ctx.beginPath(); ctx.ellipse(0, 0, r * 0.74, r * 0.4, 0, 0, Math.PI * 2); ctx.fill();
  };
  const bowl = (broth) => {  // tô sứ
    ctx.fillStyle = "#d9e3ec"; ctx.beginPath(); ctx.ellipse(0, r * 0.1, r * 0.9, r * 0.6, 0, 0, Math.PI); ctx.fill();
    ctx.fillStyle = "#f4f7fa"; ctx.beginPath(); ctx.ellipse(0, 0, r * 0.9, r * 0.48, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = broth; ctx.beginPath(); ctx.ellipse(0, 0, r * 0.75, r * 0.38, 0, 0, Math.PI * 2); ctx.fill();
  };
  const dots = (cols, n, rx, ry, rad) => { for (let i = 0; i < n; i++) { const a = i * 2.39996, d = Math.sqrt((i + 0.5) / n);
    ctx.fillStyle = cols[i % cols.length]; circle(Math.cos(a) * rx * d, Math.sin(a) * ry * d, rad); ctx.fill(); } };
  switch (id) {
    case "ca_loc_nuong_trui":   // cá lóc nướng trui trên lá chuối, kèm rau
      plate();
      ctx.fillStyle = "#4e8a35"; ctx.beginPath(); ctx.ellipse(0, 0, r * 0.82, r * 0.36, -0.15, 0, Math.PI * 2); ctx.fill();
      ctx.save(); ctx.rotate(-0.15); drawFishShape("ca_loc", r * 1.45, false);
      ctx.fillStyle = "rgba(30,15,5,.55)"; ctx.beginPath(); ctx.ellipse(0, 0, r * 0.62, r * 0.2, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      dots(["#7fc95b", "#a8de7c"], 4, r * 0.75, r * 0.4, r * 0.09);
      break;
    case "goi_bong_sung":       // gỏi bông súng: cọng súng, tôm, rau răm
      plate();
      ctx.strokeStyle = "#9ccf6e"; ctx.lineWidth = Math.max(1, r * 0.07);
      for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.moveTo(-r * 0.55 + i * r * 0.12, r * 0.25); ctx.lineTo(-r * 0.35 + i * r * 0.1, -r * 0.25); ctx.stroke(); }
      ctx.strokeStyle = "#f0884a"; ctx.lineWidth = Math.max(1.2, r * 0.1);
      [[-0.3, -0.05], [0.25, 0.05], [0, -0.18]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(dx * r, dy * r, r * 0.13, 0.3, Math.PI + 0.6); ctx.stroke(); });
      dots(["#e8799c"], 3, r * 0.6, r * 0.3, r * 0.08);
      break;
    case "lau_ca_linh_dien_dien":   // lẩu cá linh bông điên điển
      pot("#d99a3c");
      dots(["#ffd84a", "#f6c52b"], 8, r * 0.62, r * 0.3, r * 0.1);
      ctx.save(); ctx.translate(-r * 0.25, 0); drawFishShape("ca_linh", r * 0.55, false); ctx.restore();
      ctx.save(); ctx.translate(r * 0.3, r * 0.08); ctx.scale(-1, 1); drawFishShape("ca_linh", r * 0.5, false); ctx.restore();
      break;
    case "canh_chua_ca_loc":    // canh chua: cà chua, thơm, rau om
      bowl("#e3743a");
      dots(["#d93b2b", "#f2d04a", "#76b84e"], 7, r * 0.58, r * 0.27, r * 0.1);
      break;
    case "ca_keo_nuong":        // cá kèo nướng xiên que
      plate();
      ctx.strokeStyle = "#c89b5a"; ctx.lineWidth = Math.max(1, r * 0.05);
      ctx.beginPath(); ctx.moveTo(-r * 0.85, r * 0.1); ctx.lineTo(r * 0.85, -r * 0.1); ctx.stroke();
      [-0.12, 0.12].forEach((dy) => { ctx.save(); ctx.translate(0, dy * r); ctx.rotate(-0.12); drawFishShape("ca_keo", r * 1.15, false);
        ctx.fillStyle = "rgba(90,40,10,.45)"; ctx.beginPath(); ctx.ellipse(0, 0, r * 0.45, r * 0.12, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore(); });
      break;
    case "lau_mam":             // lẩu mắm: nước mắm nâu đậm, rau đồng, cà tím
      pot("#7a4a22");
      dots(["#7b3f8f", "#8fcf6b", "#ffd84a", "#c9a26b", "#e8799c"], 9, r * 0.62, r * 0.3, r * 0.1);
      break;
    default:
      bowl("#c98b4a");
  }
  if (steam && !HC) {   // khói bốc
    ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.lineWidth = Math.max(1, r * 0.07); ctx.lineCap = "round";
    for (let i = -1; i <= 1; i++) {
      const ph = T * 2 + i * 1.7 + x * 0.01;
      ctx.beginPath(); ctx.moveTo(i * r * 0.3, -r * 0.4);
      ctx.bezierCurveTo(i * r * 0.3 + Math.sin(ph) * r * 0.2, -r * 0.7, i * r * 0.3 - Math.sin(ph) * r * 0.2, -r * 0.95, i * r * 0.3, -r * 1.2); ctx.stroke();
    }
  }
  ctx.restore();
}

// Vẽ chi tiết Cá Sấu (Anatomy đầy đủ: mõm, răng, mắt bò sát, gai lưng, chân, đuôi)
function drawDetailedCrocodile(ctx, x, y, s, m, playerPos) {
  let facingRight = true;
  if (m.state === "chase" && playerPos) {
    facingRight = playerPos[0] >= m.pos[0];
  } else if (m.state === "recoil" && m.recoil_dir) {
    facingRight = m.recoil_dir[0] >= 0;
  } else if (m.waypoints && m.waypoints[m.target_idx]) {
    facingRight = m.waypoints[m.target_idx][0] >= m.pos[0];
  }

  const isChase = m.state === "chase";
  const isRecoil = m.state === "recoil";

  ctx.save();
  ctx.translate(x, y);
  if (!facingRight) ctx.scale(-1, 1);

  // Vùng cảnh báo phát hiện khi tuần tra (10m)
  if (m.state === "patrol") {
    ctx.strokeStyle = "rgba(239, 83, 80, 0.22)";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.arc(0, 0, 10 * s, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Bảng màu theo trạng thái
  const cBack = isChase ? "#7f1d1d" : isRecoil ? "#b45309" : "#143914";
  const cBody = isChase ? "#b91c1c" : isRecoil ? "#d97706" : "#245f24";
  const cBelly = isChase ? "#fca5a5" : isRecoil ? "#fde68a" : "#65a30d";
  const cSpike = isChase ? "#450a0a" : isRecoil ? "#78350f" : "#0d260d";
  const cOutline = isChase ? "#ef4444" : isRecoil ? "#fbbf24" : "#4ade80";

  // 1. Chân sau & móng
  ctx.fillStyle = cBack;
  ctx.beginPath();
  ctx.ellipse(-1.2 * s, 0.75 * s, 0.6 * s, 0.3 * s, Math.PI / 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#ffffff";
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.arc(-1.0 * s + i * 0.15 * s, 1.0 * s, 0.08 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  // 2. Chân trước & móng
  ctx.fillStyle = cBack;
  ctx.beginPath();
  ctx.ellipse(1.0 * s, 0.75 * s, 0.55 * s, 0.28 * s, Math.PI / 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#ffffff";
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.arc(1.2 * s + i * 0.15 * s, 1.0 * s, 0.08 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  // 3. Đuôi cá sấu (uốn lượn có vây răng cưa)
  ctx.fillStyle = cBody;
  ctx.beginPath();
  ctx.moveTo(-1.6 * s, -0.2 * s);
  ctx.quadraticCurveTo(-2.8 * s, -0.6 * s, -4.2 * s, -0.1 * s);
  ctx.quadraticCurveTo(-3.2 * s, 0.5 * s, -1.6 * s, 0.5 * s);
  ctx.closePath();
  ctx.fill();

  // Gai nhọn trên đuôi
  ctx.fillStyle = cSpike;
  const tailSpikes = [-3.8, -3.3, -2.8, -2.3, -1.8];
  tailSpikes.forEach((sx, i) => {
    ctx.beginPath();
    ctx.moveTo(sx * s, -0.15 * s);
    ctx.lineTo((sx + 0.25) * s, (-0.45 - (i * 0.05)) * s);
    ctx.lineTo((sx + 0.5) * s, -0.15 * s);
    ctx.fill();
  });

  // 4. Bụng dưới (sáng màu hơn có vảy ngang)
  ctx.fillStyle = cBelly;
  ctx.beginPath();
  ctx.ellipse(0, 0.3 * s, 2.2 * s, 0.6 * s, 0, 0, Math.PI);
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.18)";
  ctx.lineWidth = 1;
  for (let bx = -1.6; bx <= 1.6; bx += 0.4) {
    ctx.beginPath();
    ctx.moveTo(bx * s, 0.2 * s);
    ctx.lineTo(bx * s, 0.8 * s);
    ctx.stroke();
  }

  // Lưng cá sấu (màu sẫm)
  ctx.fillStyle = cBody;
  ctx.beginPath();
  ctx.ellipse(0, -0.1 * s, 2.4 * s, 0.7 * s, 0, Math.PI, Math.PI * 2);
  ctx.fill();

  // Gai lưng cá sấu (vảy sừng sắc nhọn dọc sống lưng)
  ctx.fillStyle = cSpike;
  const backSpikes = [-1.5, -1.0, -0.5, 0, 0.5, 1.0, 1.5];
  backSpikes.forEach((sx) => {
    ctx.beginPath();
    ctx.moveTo((sx - 0.2) * s, -0.75 * s);
    ctx.lineTo(sx * s, -1.15 * s);
    ctx.lineTo((sx + 0.2) * s, -0.75 * s);
    ctx.fill();
  });

  // 5. Mõm dài & hàm răng
  // Hàm trên
  ctx.fillStyle = cBody;
  ctx.beginPath();
  ctx.moveTo(1.8 * s, -0.6 * s);
  ctx.lineTo(2.4 * s, -0.7 * s); // ụ mắt
  ctx.lineTo(4.0 * s, -0.2 * s); // đỉnh mõm
  ctx.lineTo(4.2 * s, -0.05 * s);
  ctx.lineTo(4.2 * s, 0.1 * s);  // mép miệng
  ctx.lineTo(2.0 * s, 0.15 * s); // khóe miệng
  ctx.closePath();
  ctx.fill();

  // Lỗ mũi ở đầu mõm
  ctx.fillStyle = "#111111";
  ctx.beginPath();
  ctx.arc(4.05 * s, -0.15 * s, 0.08 * s, 0, Math.PI * 2);
  ctx.fill();

  // Hàm dưới
  ctx.fillStyle = cBack;
  ctx.beginPath();
  ctx.moveTo(2.0 * s, 0.15 * s);
  ctx.lineTo(4.1 * s, 0.12 * s);
  ctx.lineTo(3.9 * s, 0.45 * s);
  ctx.lineTo(2.0 * s, 0.5 * s);
  ctx.closePath();
  ctx.fill();

  // Răng nanh nhọn màu trắng
  ctx.fillStyle = "#ffffff";
  const teethUpper = [2.4, 2.8, 3.2, 3.6, 3.9];
  teethUpper.forEach((tx) => {
    ctx.beginPath();
    ctx.moveTo(tx * s, 0.12 * s);
    ctx.lineTo((tx + 0.1) * s, 0.32 * s);
    ctx.lineTo((tx + 0.2) * s, 0.12 * s);
    ctx.fill();
  });

  // 6. Mắt bò sát (vàng rực, con ngươi dọc)
  ctx.fillStyle = isChase ? "#ff1744" : "#facc15";
  ctx.beginPath();
  ctx.arc(2.3 * s, -0.55 * s, 0.22 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#000000";
  ctx.beginPath();
  ctx.ellipse(2.3 * s, -0.55 * s, 0.06 * s, 0.18 * s, 0, 0, Math.PI * 2);
  ctx.fill();

  // Đường viền sống lưng làm nổi bật
  ctx.strokeStyle = cOutline;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(4.2 * s, 0.0);
  ctx.lineTo(4.0 * s, -0.2 * s);
  ctx.lineTo(2.4 * s, -0.7 * s);
  ctx.stroke();

  ctx.restore();

  // Nhãn tên và trạng thái
  const stateTag = isChase ? " 🔥 ĐUỔI THEO!" : isRecoil ? ` ⚡ BẬT LÙI (${Math.ceil(m.state_ticks_left / 60)}s)` : " 🟢 TUẦN TRA";
  text(`🐊 ${m.id}${stateTag}`, x, y - 1.4 * s, { size: 12, align: "center", color: isChase ? "#ff5252" : isRecoil ? "#ffb74d" : "#86efac" });
}

// ===================== cảnh GATHER: sông phù sa nhìn ngang, x sang phải, d xuống =====================
let bgCache = { key: "", cv: null };
const bubbles = [];
let bubbleClock = 0, bubbleSeq = 0;
const HYACINTH_X = [20, 36, 52, 68, 83, 97];   // lục bình trôi (trang trí), xen giữa các nút hái

// nền tĩnh: trời bình minh, bờ dừa nước, nhà sàn, mặt sông xa, lòng sông, bùn đáy — vẽ một lần theo kích thước
function renderGatherBg(w, h, L) {
  const dpr = window.devicePixelRatio || 1;
  const off = document.createElement("canvas");
  off.width = Math.round(w * dpr); off.height = Math.round(h * dpr);
  const saved = ctx; ctx = off.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const { s, sx, sy, oy, X, D } = L;
  // trời
  const sky = ctx.createLinearGradient(0, 0, 0, oy);
  sky.addColorStop(0, "#f08a4b"); sky.addColorStop(0.45, "#f9bf73"); sky.addColorStop(1, "#fde6b8");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, w, oy + 2);
  const sunX = w * 0.16, sunY = oy - 3.6 * s;
  const glow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 9 * s);
  glow.addColorStop(0, "rgba(255,250,215,.95)"); glow.addColorStop(0.18, "rgba(255,226,150,.7)"); glow.addColorStop(1, "rgba(255,200,120,0)");
  ctx.fillStyle = glow; ctx.fillRect(0, 0, w, oy);
  ctx.fillStyle = "#fff6d8"; circle(sunX, sunY, 1.6 * s); ctx.fill();
  ctx.fillStyle = "rgba(255,240,220,.55)";
  [[0.34, 2.8, 3.2], [0.58, 4.4, 2.4], [0.83, 3.1, 3.6]].forEach(([fx, dy, sc]) => {
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(w * fx + i * sc * s * 0.55, oy - (dy + 1.2) * s - (i % 2) * s * 0.3, sc * s * 0.45, sc * s * 0.16, 0, 0, Math.PI * 2); ctx.fill(); }
  });
  // bờ xa: hàng cây, dừa nước, nhà sàn
  const bankY = oy - 1.4 * s;
  ctx.fillStyle = "#6b7a3e";
  ctx.beginPath(); ctx.moveTo(0, bankY);
  for (let x = 0; x <= w + 20; x += 18) ctx.lineTo(x, bankY - (1 + 0.6 * Math.sin(x * 0.021) + 0.35 * Math.sin(x * 0.077)) * s);
  ctx.lineTo(w, bankY + 2); ctx.lineTo(0, bankY + 2); ctx.closePath(); ctx.fill();
  const frond = (bx, by, len, col) => {   // dừa nước: tàu lá xòe từ gốc
    ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.2, 0.12 * s); ctx.lineCap = "round";
    for (let i = -3; i <= 3; i++) {
      const a = -Math.PI / 2 + i * 0.32, ex = bx + Math.cos(a) * len, ey = by + Math.sin(a) * len;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(bx + Math.cos(a) * len * 0.6, by + Math.sin(a) * len * 0.5 - len * 0.15, ex, ey + len * 0.25); ctx.stroke();
      for (let j = 1; j < 5; j++) { const t = j / 5, px = bx + (ex - bx) * t, py = by + (ey + len * 0.25 - by) * t - Math.sin(t * Math.PI) * len * 0.12;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a + 0.9) * len * 0.18, py + len * 0.12); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a - 0.9) * len * 0.18, py + len * 0.12); ctx.stroke(); }
    }
  };
  for (let i = 0; i < 12; i++) frond((i + 0.3) * (w / 12) + (i % 3) * 9, bankY + 0.2 * s, (2 + (i % 3) * 0.5) * s, i % 2 ? "#4f6a2a" : "#5c7a32");
  [0.07, 0.47, 0.9].forEach((fx, i) => {   // nhà sàn mái lá
    const hx = w * fx, hw = 3.2 * s, hb = bankY - 0.2 * s;
    ctx.strokeStyle = "#4a3320"; ctx.lineWidth = 2;
    for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(hx + k * hw / 3, hb); ctx.lineTo(hx + k * hw / 3, hb + 0.9 * s); ctx.stroke(); }
    ctx.fillStyle = "#8a6440"; ctx.fillRect(hx - 0.1 * s, hb - 1.3 * s, hw + 0.2 * s, 1.3 * s);
    ctx.fillStyle = "#3b2a18"; ctx.fillRect(hx + hw * 0.4, hb - 0.95 * s, 0.6 * s, 0.6 * s);
    ctx.fillStyle = i === 1 ? "#a98a52" : "#9c7d48"; ctx.beginPath(); ctx.moveTo(hx - 0.6 * s, hb - 1.2 * s); ctx.lineTo(hx + hw / 2, hb - 2.6 * s); ctx.lineTo(hx + hw + 0.6 * s, hb - 1.2 * s); ctx.closePath(); ctx.fill();
  });
  // mặt sông xa (mờ sương)
  const far = ctx.createLinearGradient(0, bankY, 0, oy);
  far.addColorStop(0, "#c9b27a"); far.addColorStop(1, "#b29a5c");
  ctx.fillStyle = far; ctx.fillRect(0, bankY, w, oy - bankY + 1);
  ctx.strokeStyle = "rgba(255,240,200,.35)"; ctx.lineWidth = 1;
  for (let i = 0; i < 14; i++) { const y = bankY + ((i * 7) % (oy - bankY)); ctx.beginPath(); ctx.moveTo((i * 97) % w, y); ctx.lineTo((i * 97) % w + 22, y); ctx.stroke(); }
  // lòng sông phù sa
  const water = ctx.createLinearGradient(0, oy, 0, sy(D));
  water.addColorStop(0, "#a8925a"); water.addColorStop(0.12, "#857f44"); water.addColorStop(0.45, "#4c5a2d"); water.addColorStop(1, "#121b0f");
  ctx.fillStyle = water; ctx.fillRect(0, oy, w, sy(D) - oy + 1);
  // bùn đáy + đá + rễ
  ctx.fillStyle = "#2a2014";
  ctx.beginPath(); ctx.moveTo(0, h);
  for (let x = 0; x <= w + 16; x += 16) ctx.lineTo(x, sy(D) - (0.25 + 0.25 * Math.sin(x * 0.03) + 0.15 * Math.sin(x * 0.11)) * s);
  ctx.lineTo(w, h); ctx.closePath(); ctx.fill();

function gatherLayout(w, h, meta) {

// ===================== mode day (TV4): băng ngày, thẻ chuyển buổi, Shop ghe tạp hóa =====================
const PHASE_NAME = { gather: "Buổi sáng — lặn hái", quan: "Buổi tối — mở quán", shop: "Ghe tạp hóa cuối ngày", done: "Kết thúc" };
const PHASE_SUB = { gather: "Xuống sông hái bông súng, điên điển, bắt cá đồng", quan: "Lên đèn, nhóm bếp, đón khách", shop: "Mua thêm bình oxy, Máu cho ngày mai", done: "Cảm ơn đã ghé Quán Ăn Chợ Nổi" };
let phaseKey = "", phaseAt = -10;
function dayBanner(w, h) {

  }

    text("TẠM DỪNG", w / 2, h / 2 - 6, { align: "center", size: 28, weight: "bold", color: "#ffe2a0" });

}
function drawTank(x, y, k) {   // bình oxy

  ctx.fillStyle = "rgba(255,255,255,.3)"; rr(x - 0.25 * k, y - 0.7 * k, 0.15 * k, 1.3 * k, 0.07 * k); ctx.fill();
  ctx.fillStyle = "#b0bec5"; ctx.fillRect(x - 0.12 * k, y - 1.05 * k, 0.24 * k, 0.28 * k); ctx.fillRect(x - 0.3 * k, y - 1.12 * k, 0.6 * k, 0.1 * k);
  ctx.fillStyle = "#ffd257"; ctx.fillRect(x - 0.35 * k, y - 0.1 * k, 0.7 * k, 0.14 * k);

function drawShop(w, h) {
  // hoàng hôn trên sông
  const sky = ctx.createLinearGradient(0, 0, 0, h * 0.55);
  sky.addColorStop(0, "#2b1d3f"); sky.addColorStop(0.6, "#a8475a"); sky.addColorStop(1, "#f29a5c");

  river.addColorStop(0, "#6b4a4a"); river.addColorStop(1, "#1a1420");
  ctx.fillStyle = river; ctx.fillRect(0, h * 0.55, w, h * 0.45);
  ctx.fillStyle = "#2a1a22"; ctx.beginPath(); ctx.moveTo(0, h * 0.55);
  for (let x = 0; x <= w + 20; x += 20) ctx.lineTo(x, h * 0.55 - (14 + 10 * Math.sin(x * 0.02) + 6 * Math.sin(x * 0.09)));
  ctx.lineTo(w, h * 0.55); ctx.closePath(); ctx.fill();

    ctx.strokeStyle = `rgba(255,170,110,${0.25 - i * 0.008})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(w / 2 - 60 + o - i * 3, y); ctx.lineTo(w / 2 + 60 + o + i * 3, y); ctx.stroke(); }

  const gx = w / 2, gy = h * 0.6 + Math.sin(T * 1.2) * 3, gw = Math.min(w * 0.8, 760);
  ctx.fillStyle = "#3e2614"; ctx.beginPath(); ctx.moveTo(gx - gw / 2, gy - 10); ctx.quadraticCurveTo(gx, gy + 60, gx + gw / 2, gy - 18); ctx.lineTo(gx + gw / 2 - 30, gy + 8); ctx.quadraticCurveTo(gx, gy + 40, gx - gw / 2 + 30, gy + 8); ctx.closePath(); ctx.fill();

  text(snap.day_phase === "done" ? "Hết " + (snap.days || "") + " ngày" : "Cuối ngày " + snap.day + " · 💰 " + (snap.money ?? 0) + "k", gx, 122, { align: "center", size: 14, color: "#ffd9a8" });

    text("Uy tín " + (snap.reputation ?? 0).toFixed(1) + " · Điểm " + (snap.score ?? 0), gx, 302, { align: "center", size: 15 });

// ---------- v1.3: cảnh báo chữ + biểu tượng, tương phản cao (chỉ đọc snapshot, không đụng mô phỏng) ----------
let HC = false;
function setHighContrast(on) {
  HC = !!on; document.body.classList.toggle("hc", HC);
  try { localStorage.setItem("chonoi.hc", HC ? "1" : "0"); } catch (e) {}
}
setHighContrast(new URLSearchParams(location.search).get("contrast") === "high" ||
                (() => { try { return localStorage.getItem("chonoi.hc") === "1"; } catch (e) { return false; } })());
const OXY_LOW = 0.25, PATIENCE_LOW = 0.25;   // ngưỡng hiển thị (UI), cùng mốc đỏ của thanh oxy
function monsterNear(m, p, meta) {
  if (!m || !p) return false;
  if (m.state === "chase") return true;
  const sp = (meta.monsters && meta.monsters.species && meta.monsters.species[m.kind]) || {};
  const r = sp.detect_radius || 10;
  return Math.hypot(m.pos[0] - p.pos[0], m.pos[1] - p.pos[1]) <= r;
}
function oxygenLow(p) {
  if (!p || p.oxygen_ticks === undefined || !p.oxygen_max_ticks) return false;
  const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
  return underwater && p.oxygen_ticks < p.oxygen_max_ticks * OXY_LOW;
}
function customerAngry(c, patMax) {
  return c && c.state !== "eating" && c.patience_ticks_left !== undefined && c.patience_ticks_left < patMax * PATIENCE_LOW;
}
function activeWarnings() {
  const out = [], view = viewMode(), meta = snap.meta || {}, p = snap.player;
  if (snap.finished || snap.paused) return out;   // buổi đã kết thúc / đang dừng: không cảnh báo
  if (view === "gather") {
    const near = (snap.monsters || []).filter((m) => monsterNear(m, p, meta));
    if (near.length) out.push({ icon: "🐊", text: "CÁ SẤU GẦN! (" + near.map((m) => m.id).join(", ") + ") — bơi lên dưới 10 m", kind: "monster" });
    if (oxygenLow(p)) out.push({ icon: "🫧", text: "OXY SẮP HẾT! còn " + Math.ceil(p.oxygen_ticks / 60) + " s — ngoi lên mặt nước", kind: "oxygen" });
  } else if (view === "quan") {
    const patMax = (meta.patience_s || 60) * 60;
    const angry = (snap.customers || []).filter((c) => customerAngry(c, patMax));
    if (angry.length) out.push({ icon: "😠", text: "KHÁCH SẮP GIẬN! " + angry.map((c) => c.id + "@" + c.table_id).join(", "), kind: "customer" });
  }
  return out;
}
function warnTag(s, x, y) {
  ctx.font = "bold " + (HC ? 15 : 12) + "px system-ui, sans-serif";
  const w = ctx.measureText(s).width + 12, h = HC ? 22 : 18;
  ctx.fillStyle = HC ? "#000" : "rgba(120,0,0,.85)"; ctx.fillRect(x - w / 2, y - h + 4, w, h);
  ctx.strokeStyle = HC ? "#ffeb3b" : "#ff8a80"; ctx.lineWidth = HC ? 3 : 1.5; ctx.strokeRect(x - w / 2, y - h + 4, w, h);
  text(s, x, y, { size: HC ? 15 : 12, align: "center", color: HC ? "#ffeb3b" : "#fff" });
}
function drawWarnings(w, h) {
  const list = activeWarnings();
  list.forEach((wr, i) => {
    const bw = Math.min(w - 40, 640), bh = HC ? 44 : 36, x = (w - bw) / 2, y = 74 + i * (bh + 8);
    const blink = !HC && Math.floor(Date.now() / 400) % 2;    // HC: không nhấp nháy
    ctx.fillStyle = HC ? "#000" : (blink ? "rgba(183,28,28,.92)" : "rgba(120,10,10,.92)"); ctx.fillRect(x, y, bw, bh);
    ctx.strokeStyle = HC ? "#ffeb3b" : "#ffcdd2"; ctx.lineWidth = HC ? 4 : 2; ctx.strokeRect(x, y, bw, bh);
    text(wr.icon + "  ⚠  " + wr.text, w / 2, y + bh / 2 + (HC ? 7 : 6), { size: HC ? 20 : 16, align: "center", color: HC ? "#ffeb3b" : "#fff" });
  });
  const hy = { gather: h - 92, quan: h - 74 }[viewMode()] || h - 30;   // ngay trên giỏ / kho
  text((HC ? "◼ TƯƠNG PHẢN CAO: BẬT" : "H: tương phản cao"), 14, hy, { size: HC ? 14 : 11, color: HC ? "#ffeb3b" : "#f3e3c3", stroke: "rgba(0,0,0,.5)", strokeW: 2 });
}

let lastFrame = 0;
function frame(now) {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const t = (now || performance.now()) / 1000;
  DT = lastFrame ? Math.min(0.1, t - lastFrame) : 0; lastFrame = t; T = t;
  const [w, h] = fit();
  ctx.fillStyle = "#120d08"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    trackSnapshot();
    const view = viewMode();
    if (view === "quan") drawQuan(w, h); else if (view === "shop" || view === "done") drawShop(w, h); else drawGather(w, h);
    if (snap.mode === "day") dayBanner(w, h);
    drawWarnings(w, h);
    eventLog(w, h);
    overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải… Quán Ăn Chợ Nổi", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
